name: Build NineCrowns

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find NineCrowns project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f -iname "settings.gradle" -print -quit)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            BUILD=$(find . -type f -iname "build.gradle" -print -quit)
            if [ -z "$BUILD" ]; then
              echo "ERRORE: non trovo né settings.gradle né build.gradle"
              find . -maxdepth 4 -type f
              exit 1
            fi
            PROJECT_DIR=$(dirname "$BUILD")
          fi

          echo "Progetto trovato in: $PROJECT_DIR"

          # Corregge automaticamente eventuali maiuscole
          if [ -f "$PROJECT_DIR/Settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            mv "$PROJECT_DIR/Settings.gradle" "$PROJECT_DIR/settings.gradle"
          fi

          if [ -f "$PROJECT_DIR/Build.gradle" ] && [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            mv "$PROJECT_DIR/Build.gradle" "$PROJECT_DIR/build.gradle"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
          cache-disabled: true

      - name: Build NineCrowns
        run: gradle -p "$PROJECT_DIR" clean build --no-daemon

      - name: Find and verify JAR
        shell: bash
        run: |
          set -e

          JAR=$(find "$PROJECT_DIR/build/libs" -type f -name "*.jar" ! -name "*sources*" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERRORE: JAR non trovato"
            exit 1
          fi

          echo "JAR trovato: $JAR"

          jar tf "$JAR" > jar-contents.txt

          grep -q "fabric.mod.json" jar-contents.txt
          grep -q "NineCrowns.class" jar-contents.txt
          grep -q "ModItems.class" jar-contents.txt

          echo "JAR verificato correttamente."

          mkdir -p final-jar
          cp "$JAR" final-jar/

      - name: Upload NineCrowns
        uses: actions/upload-artifact@v4
        with:
          name: NineCrowns-26.1-v1.2.2
          path: final-jar/*.jar
          if-no-files-found: error
